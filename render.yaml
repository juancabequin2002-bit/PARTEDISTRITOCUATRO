services:
  - type: web
    name: ParteDistritoCuatro
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r python_parte_fuerza/requirements.txt
    startCommand: python python_parte_fuerza/app.py
    healthCheckPath: /up
    disk:
      name: partedistritocuatro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
